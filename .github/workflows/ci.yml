name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: macOS tests and source archive
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check version
        id: version
        run: |
          /usr/bin/python3 --version
          version=$(/usr/bin/python3 -I scripts/release.py check)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Test release tooling
        run: /usr/bin/python3 -I -m unittest discover -s scripts -p 'test_*.py'
      - name: Test runtime
        run: /usr/bin/python3 -I -m unittest discover -s skills/skill-evolver/tests -p 'test_*.py'
      - name: Validate committed source archive
        run: |
          /usr/bin/python3 -I scripts/release.py archive --output "$RUNNER_TEMP/release"
          {
            echo "Version: $(/usr/bin/python3 -I scripts/release.py check)"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Build: $GITHUB_RUN_NUMBER (attempt $GITHUB_RUN_ATTEMPT)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skill-evolver-${{ steps.version.outputs.version }}-${{ github.run_number }}-${{ github.sha }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 14
